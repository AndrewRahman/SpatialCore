name: SpatialCore CI

# What runs when:
#   On a manual run only (D-20; no build on a branch push, a tag push or a pull request): macos-gate, the same gate as the
#   local one (README "Local test gate"): Debug build with both test executables run, Release
#   build with ctest from the build root, the ui: listing check, then the consumer harness
#   (a real git submodule of this repository at the commit under test) and its sound check.
#   The same run also runs linux-tests (Release build of every target, then the
#   whole suite through ctest from the build root) and windows-build (MSVC Release build of every
#   target, no test run: Windows is build-only by decision D-08, running the suite there is deferred).
#   It also runs coverage (scripts/coverage.sh: an instrumented Debug build,
#   both test executables, a per-area table on the run's summary page and the full report as the
#   coverage-report artifact). It fails when the engine figure is below scripts/coverage-targets.json.
#   On a manual run with the realtime input ticked: realtime-nightly (README
#   "Realtime-safety check", steps 1-5). It has no schedule and never runs on its own; run it
#   before a release tag (user decision 2026-10-24).
#
# Security posture: the token is read-only, there is no trigger that runs outside code, no secret is used, every action is first-party and pinned to a commit SHA, and
# values from workflow expressions reach scripts only through env entries.

# Manual only (2026-10-25): no automatic runs until a release candidate. Out of Actions minutes. Dispatch: gh workflow run ci.yml
# Nothing starts this workflow on its own: no branch push, tag push, pull request, schedule or
# workflow_run. It runs only when started by hand (Actions, "SpatialCore CI", Run workflow, or gh).
on:
  workflow_dispatch:
    inputs:
      realtime:
        description: Also run the realtime-safety check (ThreadSanitizer and the allocation trap)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Tests/Support/Watchdog.h multiplies its time limits by this integer. The runner has 3 cores,
  # so the timing-sensitive cases get four times the local allowance.
  SPATIALCORE_TEST_TIMEOUT_SCALE: "4"

jobs:
  macos-gate:
    name: macos-gate
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false  # the HRTF files come from the cache below, then git lfs pull
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Restore HRTF LFS objects
        # With lfs: false the .sofa files are pointer text carrying each object's hash, so the
        # key changes only when an HRTF file changes and a hit makes git lfs pull download nothing.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('HRTF/*.sofa') }}

      - name: Pull HRTF data
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

      - name: Verify HRTF data is real content
        # A pointer file or a truncated download would otherwise reach the build. A real SOFA file
        # is an HDF5 file (signature 89 48 44 46) of hundreds of KB to tens of MB.
        run: |
          set -euo pipefail
          count=0
          for f in HRTF/*.sofa; do
            count=$((count + 1))
            sig=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$sig" != "89484446" ]; then
              echo "FATAL: $f does not start with the HDF5 signature (got '$sig')" >&2
              exit 1
            fi
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -lt 100000 ]; then
              echo "FATAL: $f is suspiciously small ($size bytes), expected real SOFA data" >&2
              exit 1
            fi
          done
          if [ "$count" -ne 5 ]; then
            echo "FATAL: expected 5 HRTF files, found $count" >&2
            exit 1
          fi
          echo "All 5 SOFA files resolved to real LFS content."

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          clang --version
          cmake --version

      - name: Configure Debug
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          juce_version=$(git -C build/_deps/juce-src describe --tags)
          echo "JUCE checkout: $juce_version"
          if [ "$juce_version" != "9.0.0" ]; then
            echo "FATAL: JUCE is at '$juce_version', expected 9.0.0" >&2
            exit 1
          fi

      - name: Build Debug (every target)
        run: |
          set -euo pipefail
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Debug SpatialCoreTests
        # The exit status is the verdict. A Debug run prints expected JUCE assertion lines and a
        # leaked-object note at exit and still exits 0. It also prints libmysofa's verbose parser
        # trace (hundreds of thousands of lines): through the runner's log pipe that output stalls
        # the test process and starves the wall-clock rate tests, so it goes to a file and only the
        # verdict and any failure blocks are printed.
        timeout-minutes: 90
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/debug-core.log"
          status=0
          ./build/tests/SpatialCoreTests > "$log" 2>&1 || status=$?
          echo "exit status: $status ($(wc -l < "$log" | tr -d ' ') log lines)"
          tail -8 "$log"
          if [ "$status" -ne 0 ]; then
            grep -n -B8 -A14 'FAILED:' "$log" | head -400 || true
            tail -40 "$log"
            exit "$status"
          fi

      - name: Debug SpatialCoreUITests
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/debug-ui.log"
          status=0
          ./build/tests/SpatialCoreUITests > "$log" 2>&1 || status=$?
          echo "exit status: $status ($(wc -l < "$log" | tr -d ' ') log lines)"
          tail -8 "$log"
          if [ "$status" -ne 0 ]; then
            grep -n -B8 -A14 'FAILED:' "$log" | head -400 || true
            tail -40 "$log"
            exit "$status"
          fi

      - name: Configure Release (reusing the downloaded sources)
        run: |
          set -euo pipefail
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src" \
            -DFETCHCONTENT_SOURCE_DIR_CATCH2="$PWD/build/_deps/catch2-src" \
            -DFETCHCONTENT_SOURCE_DIR_MYSOFA="$PWD/build/_deps/mysofa-src"

      - name: Build Release (every target)
        run: |
          set -euo pipefail
          cmake --build build-release -j "$(sysctl -n hw.ncpu)"

      - name: Release ctest (from the build root)
        # --no-tests=error turns "discovered zero tests" into a failure instead of a green run.
        run: |
          set -euo pipefail
          ctest --test-dir build-release --no-tests=error --output-on-failure -j "$(sysctl -n hw.ncpu)"

      - name: Check the UI tests are in the run
        run: |
          set -euo pipefail
          ctest --test-dir build-release -N > "$RUNNER_TEMP/ctest-list.txt"
          ui_count=$(grep -c 'ui:' "$RUNNER_TEMP/ctest-list.txt" || true)
          echo "ui: tests listed: $ui_count"
          if [ "$ui_count" -le 0 ]; then
            echo "FATAL: no ui: tests are listed, SpatialCoreUITests is not in the run" >&2
            exit 1
          fi

      - name: Consumer harness and sound check
        timeout-minutes: 60
        env:
          SHA_UNDER_TEST: ${{ github.event.pull_request.head.sha || github.sha }}
          HARNESS_WORK_DIR: ${{ runner.temp }}/harness
        run: |
          set -euo pipefail
          examples/harness/scripts/build-consumer.sh "$SHA_UNDER_TEST" -- \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src" \
            -DFETCHCONTENT_SOURCE_DIR_MYSOFA="$PWD/build/_deps/mysofa-src"

  linux-tests:
    name: linux-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Restore HRTF LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('HRTF/*.sofa') }}

      - name: Pull HRTF data
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

      - name: Verify HRTF data is real content
        run: |
          set -euo pipefail
          count=0
          for f in HRTF/*.sofa; do
            count=$((count + 1))
            sig=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$sig" != "89484446" ]; then
              echo "FATAL: $f does not start with the HDF5 signature (got '$sig')" >&2
              exit 1
            fi
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -lt 100000 ]; then
              echo "FATAL: $f is suspiciously small ($size bytes), expected real SOFA data" >&2
              exit 1
            fi
          done
          if [ "$count" -ne 5 ]; then
            echo "FATAL: expected 5 HRTF files, found $count" >&2
            exit 1
          fi
          echo "All 5 SOFA files resolved to real LFS content."

      - name: Install system packages
        # The development packages JUCE needs to build on Linux, plus xvfb so the UI tests have
        # a display to connect to (the ctest step runs under xvfb-run).
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev \
            zlib1g-dev xvfb

      - name: Toolchain
        run: |
          set -euo pipefail
          gcc --version
          cmake --version
          nproc

      - name: Configure Release
        run: |
          set -euo pipefail
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          juce_version=$(git -C build-release/_deps/juce-src describe --tags)
          echo "JUCE checkout: $juce_version"
          if [ "$juce_version" != "9.0.0" ]; then
            echo "FATAL: JUCE is at '$juce_version', expected 9.0.0" >&2
            exit 1
          fi

      - name: Build Release (every target)
        run: |
          set -euo pipefail
          cmake --build build-release -j "$(nproc)"

      - name: Release ctest (from the build root)
        # --no-tests=error turns "discovered zero tests" into a failure instead of a green run.
        # The [rt] cases report SKIPPED here: the allocation trap is built on macOS only.
        run: |
          set -euo pipefail
          xvfb-run -a ctest --test-dir build-release --no-tests=error --output-on-failure -j "$(nproc)"

      - name: Check the UI tests are in the run
        run: |
          set -euo pipefail
          ctest --test-dir build-release -N > "$RUNNER_TEMP/ctest-list.txt"
          ui_count=$(grep -c 'ui:' "$RUNNER_TEMP/ctest-list.txt" || true)
          echo "ui: tests listed: $ui_count"
          if [ "$ui_count" -le 0 ]; then
            echo "FATAL: no ui: tests are listed, SpatialCoreUITests is not in the run" >&2
            exit 1
          fi

  windows-build:
    name: windows-build
    # Pinned: windows-latest is currently this image (Windows Server 2025 with Visual Studio 2026).
    # Build-only by decision D-08: MSVC compiles every target, including the Windows-only code
    # branches, and no test is run. Running the suite on Windows is deferred.
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Restore HRTF LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('HRTF/*.sofa') }}

      - name: Pull HRTF data
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

      - name: Verify HRTF data is real content
        run: |
          set -euo pipefail
          count=0
          for f in HRTF/*.sofa; do
            count=$((count + 1))
            sig=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$sig" != "89484446" ]; then
              echo "FATAL: $f does not start with the HDF5 signature (got '$sig')" >&2
              exit 1
            fi
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -lt 100000 ]; then
              echo "FATAL: $f is suspiciously small ($size bytes), expected real SOFA data" >&2
              exit 1
            fi
          done
          if [ "$count" -ne 5 ]; then
            echo "FATAL: expected 5 HRTF files, found $count" >&2
            exit 1
          fi
          echo "All 5 SOFA files resolved to real LFS content."

      - name: Toolchain
        run: |
          set -euo pipefail
          cmake --version
          echo "vcpkg root: ${VCPKG_INSTALLATION_ROOT:-<unset>}"

      - name: Install zlib
        # SpatialCore and libmysofa need zlib, and Windows has none (on Linux and macOS it is a
        # system library). libmysofa's own MSVC branch tries "nuget install zlib", which finds no
        # such package. The runner's preinstalled vcpkg builds it: static library, dynamic C
        # runtime (x64-windows-static-md), the runtime JUCE uses.
        run: |
          set -euo pipefail
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md
          ls "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md/lib"

      - name: Configure
        # libmysofa's MSVC branch adds no zlib include path (it expects a nuget package unpacked
        # inside its own source tree), so the vcpkg include folder reaches the C compiler as -I,
        # through the CFLAGS and CXXFLAGS environment variables, which CMake appends to its
        # default compiler flags on the first configure. zlib 1.3.2 names its static Windows
        # library zs.lib, which CMake's FindZLIB does not search for, so the library is given
        # explicitly.
        run: |
          set -euo pipefail
          zlib_root=$(cygpath -m "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md")
          export CFLAGS="-I$zlib_root/include"
          export CXXFLAGS="-I$zlib_root/include"
          cmake -S . -B build \
            -DZLIB_INCLUDE_DIR="$zlib_root/include" \
            -DZLIB_LIBRARY="$zlib_root/lib/zs.lib"
          juce_version=$(git -C build/_deps/juce-src describe --tags)
          echo "JUCE checkout: $juce_version"
          if [ "$juce_version" != "9.0.0" ]; then
            echo "FATAL: JUCE is at '$juce_version', expected 9.0.0" >&2
            exit 1
          fi

      - name: Build Release (SpatialCore, SpatialCoreUI and both test executables, no test run)
        # One cmake call per target, so a compile error in one target does not hide the errors of
        # the targets after it; the step fails when any of the four failed.
        run: |
          set -euo pipefail
          status=0
          for target in SpatialCore SpatialCoreUI SpatialCoreTests SpatialCoreUITests; do
            echo "::group::Build $target"
            cmake --build build --config Release --target "$target" --parallel || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Coverage never leaves GitHub (D-15): the table goes to this run's job summary and the files
  # to a downloadable artifact, with no outside service, account or token. scripts/coverage.sh
  # passes scripts/coverage-targets.json (Plan 06-08) to the report script, and an engine figure
  # below the target fails the job (D-14). The UI figure is reported only.
  coverage:
    name: coverage
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Restore HRTF LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('HRTF/*.sofa') }}

      - name: Pull HRTF data
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

      - name: Verify HRTF data is real content
        run: |
          set -euo pipefail
          count=0
          for f in HRTF/*.sofa; do
            count=$((count + 1))
            sig=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$sig" != "89484446" ]; then
              echo "FATAL: $f does not start with the HDF5 signature (got '$sig')" >&2
              exit 1
            fi
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -lt 100000 ]; then
              echo "FATAL: $f is suspiciously small ($size bytes), expected real SOFA data" >&2
              exit 1
            fi
          done
          if [ "$count" -ne 5 ]; then
            echo "FATAL: expected 5 HRTF files, found $count" >&2
            exit 1
          fi
          echo "All 5 SOFA files resolved to real LFS content."

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --find llvm-cov
          xcrun --find llvm-profdata
          cmake --version

      - name: Instrumented Debug build, both test executables, coverage report
        timeout-minutes: 120
        run: |
          set -euo pipefail
          scripts/coverage.sh build-cov

      - name: Coverage table on the run summary page
        if: always()
        run: |
          set -euo pipefail
          if [ -f build-cov/coverage/summary.md ]; then
            cat build-cov/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary was written (see the build and test steps above)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            build-cov/coverage/summary.md
            build-cov/coverage/summary.json
            build-cov/coverage/core-summary.json
            build-cov/coverage/ui-summary.json
            build-cov/coverage/html/
          retention-days: 14
          if-no-files-found: error

  # The realtime-safety check runs only on a manual run of this workflow with the realtime input
  # on (any branch), before a release tag. There is no schedule and no push trigger: the job
  # keeps its name so existing references to it still resolve.
  realtime-nightly:
    name: realtime-nightly
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.realtime)
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Restore HRTF LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('HRTF/*.sofa') }}

      - name: Pull HRTF data
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

      - name: Verify HRTF data is real content
        run: |
          set -euo pipefail
          count=0
          for f in HRTF/*.sofa; do
            count=$((count + 1))
            sig=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$sig" != "89484446" ]; then
              echo "FATAL: $f does not start with the HDF5 signature (got '$sig')" >&2
              exit 1
            fi
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -lt 100000 ]; then
              echo "FATAL: $f is suspiciously small ($size bytes), expected real SOFA data" >&2
              exit 1
            fi
          done
          if [ "$count" -ne 5 ]; then
            echo "FATAL: expected 5 HRTF files, found $count" >&2
            exit 1
          fi
          echo "All 5 SOFA files resolved to real LFS content."

      - name: Configure and build Release
        run: |
          set -euo pipefail
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          juce_version=$(git -C build-release/_deps/juce-src describe --tags)
          echo "JUCE checkout: $juce_version"
          if [ "$juce_version" != "9.0.0" ]; then
            echo "FATAL: JUCE is at '$juce_version', expected 9.0.0" >&2
            exit 1
          fi
          cmake --build build-release -j "$(sysctl -n hw.ncpu)"

      - name: "Step 1: allocation and lock trap ([rt], Release)"
        run: |
          set -euo pipefail
          ./build-release/tests/SpatialCoreTests "[rt]"

      - name: "Step 2: configure and build the ThreadSanitizer tree"
        run: |
          set -euo pipefail
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build-release/_deps/juce-src" \
            -DFETCHCONTENT_SOURCE_DIR_CATCH2="$PWD/build-release/_deps/catch2-src" \
            -DFETCHCONTENT_SOURCE_DIR_MYSOFA="$PWD/build-release/_deps/mysofa-src"
          cmake --build build-tsan -j "$(sysctl -n hw.ncpu)"

      # Steps 3 to 5 pass only when the exit status is 0 and the count of "WARNING: ThreadSanitizer"
      # lines is 0 (README). The grep pattern below spells the last letter as a bracket class so that
      # the job log, which echoes the script, never matches its own text.
      - name: "Step 3: thread-interaction subset under ThreadSanitizer ([tsan])"
        timeout-minutes: 150
        env:
          SPATIALCORE_TEST_TIMEOUT_SCALE: "10"
          TSAN_OPTIONS: "halt_on_error=0 second_deadlock_stack=1"
        run: |
          set -euo pipefail
          mkdir -p tsan-logs
          log="tsan-logs/sc-tsan.log"
          status=0
          ./build-tsan/tests/SpatialCoreTests "[tsan]" > "$log" 2>&1 || status=$?
          echo "exit=$status"
          tail -5 "$log"
          warnings=$(grep -c "WARNING: ThreadSanitize[r]" "$log" || true)
          echo "sc-tsan.log: exit=$status, ThreadSanitizer warnings=$warnings"
          if [ "$status" -ne 0 ] || [ "$warnings" -ne 0 ]; then
            echo "FATAL: the [tsan] subset must exit 0 with 0 ThreadSanitizer warnings" >&2
            exit 1
          fi

      - name: "Step 4: UI suite under ThreadSanitizer"
        env:
          SPATIALCORE_TEST_TIMEOUT_SCALE: "10"
          TSAN_OPTIONS: "halt_on_error=0 second_deadlock_stack=1"
        run: |
          set -euo pipefail
          mkdir -p tsan-logs
          log="tsan-logs/sc-tsan-ui.log"
          status=0
          ./build-tsan/tests/SpatialCoreUITests > "$log" 2>&1 || status=$?
          echo "exit=$status"
          tail -5 "$log"
          warnings=$(grep -c "WARNING: ThreadSanitize[r]" "$log" || true)
          echo "sc-tsan-ui.log: exit=$status, ThreadSanitizer warnings=$warnings"
          if [ "$status" -ne 0 ] || [ "$warnings" -ne 0 ]; then
            echo "FATAL: the UI suite must exit 0 with 0 ThreadSanitizer warnings" >&2
            exit 1
          fi

      - name: "Step 5: whole SpatialCoreTests suite under ThreadSanitizer"
        timeout-minutes: 150
        env:
          SPATIALCORE_TEST_TIMEOUT_SCALE: "10"
          TSAN_OPTIONS: "halt_on_error=0 second_deadlock_stack=1"
        run: |
          set -euo pipefail
          mkdir -p tsan-logs
          log="tsan-logs/sc-tsan-full.log"
          status=0
          ./build-tsan/tests/SpatialCoreTests > "$log" 2>&1 || status=$?
          echo "exit=$status" >> "$log"
          tail -5 "$log"
          warnings=$(grep -c "WARNING: ThreadSanitize[r]" "$log" || true)
          echo "sc-tsan-full.log: exit=$status, ThreadSanitizer warnings=$warnings"
          if [ "$status" -ne 0 ] || [ "$warnings" -ne 0 ]; then
            echo "FATAL: the whole suite must exit 0 with 0 ThreadSanitizer warnings" >&2
            exit 1
          fi

      - name: Upload ThreadSanitizer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsan-logs
          path: tsan-logs
          retention-days: 14
          if-no-files-found: warn
